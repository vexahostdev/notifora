[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Urutan queue = prioritas. Skala numprocs sesuai beban (lihat BACKEND_SPEC §4.1).
[program:queue-high-default]
command=php /var/www/html/artisan queue:work redis --queue=notifora_high,notifora_default --sleep=1 --tries=3 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=60
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-channels]
command=php /var/www/html/artisan queue:work redis --queue=notifora_channels --sleep=1 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=6
autostart=true
autorestart=true
stopwaitsecs=60
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-webhooks]
command=php /var/www/html/artisan queue:work redis --queue=notifora_webhooks --sleep=2 --max-time=3600
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
stopwaitsecs=30
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
