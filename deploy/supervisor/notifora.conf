; Supervisor (server tanpa Docker): satu program menjalankan semua worker + scheduler.
; Salin ke /etc/supervisor/conf.d/notifora.conf lalu: supervisorctl reread && supervisorctl update
[program:notifora]
command=php /var/www/notifora/artisan notifora:supervise
directory=/var/www/notifora
user=www-data
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/var/log/notifora/supervisor.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
