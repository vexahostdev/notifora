# Server tanpa Docker: aplikasi (PHP-FPM) + proxy WSS ke socket engine. Pasang TLS dengan certbot.
server {
    listen 80;
    server_name notifora.my.id api.notifora.my.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name notifora.my.id api.notifora.my.id;
    root /var/www/notifora/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/notifora.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notifora.my.id/privkey.pem;

    client_max_body_size 5m;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /storage/backups { deny all; }
}

server {
    listen 443 ssl http2;
    server_name ws.notifora.my.id;
    ssl_certificate     /etc/letsencrypt/live/notifora.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notifora.my.id/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8042;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }
}
