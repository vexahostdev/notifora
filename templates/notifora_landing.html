  <!-- Babel Standalone for JSX compilation -->

  <style>
    :root {
      --spray-blue: #0033FF;
      --spray-blue-bright: #0047FF;
      --spray-cyan: #0077FF;

    }

    body {
      margin: 0;
      padding: 0;
      background-color: #E3E7EE;
      color: #0D0D0D;

    /* Ultra-heavy condensed/grotesque display typography matching reference */
    .font-display {
      font-family: 'Archivo Black', 'Inter', sans-serif;

      line-height: 0.91;
    }

    .font-jp {
      font-family: 'Noto Sans JP', sans-serif;
    }

    /* Concrete & Plaster Procedural Background Textures */
    .concrete-hero {
      background-color: #DCE1E9;
      background-image:
        radial-gradient(at 18% 25%, rgba(255, 255, 255, 0.45) 0px, transparent 55%),
        radial-gradient(at 82% 70%, rgba(185, 195, 210, 0.5) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(215, 222, 232, 0.8) 0px, rgba(198, 206, 218, 0.4) 100%);

    .concrete-section-2 {

      background-image:
        radial-gradient(at 15% 5%, #D5DCE6 0%, transparent 45%),

<body>
  <!-- Global SVG Filters for Realistic Aerosol Spray Paint, Stipple Mist, and Concrete Grain -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
    <defs>
      <!-- 1. Aerosol Spray Edge Filter (Used on Infinity Loop & Graffiti Strokes) -->
      <filter id="aerosol-spray" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox">
        <!-- High-frequency noise for fine paint droplets -->
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="14" result="fineNoise" />
        <!-- Medium-frequency noise for irregular spray edge -->
        <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="3" seed="5" result="coarseNoise" />
        <!-- Combine displace for gritty aerosol edge -->
        <feDisplacementMap in="SourceGraphic" in2="coarseNoise" scale="11" xChannelSelector="R" yChannelSelector="G" result="coarseDisplaced" />
        <feDisplacementMap in="coarseDisplaced" in2="fineNoise" scale="16" xChannelSelector="R" yChannelSelector="B" result="fineDisplaced" />
        <!-- Soft outer mist halo -->
        <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="mistBlur" />
        <feDisplacementMap in="mistBlur" in2="fineNoise" scale="26" xChannelSelector="G" yChannelSelector="R" result="mistDisplaced" />
        <feMerge>
          <feMergeNode in="mistDisplaced" />
          <feMergeNode in="fineDisplaced" />
        </feMerge>
      </filter>

      <!-- 2. Sharp Handstyle Graffiti Filter (Used on "Go HARD" & Graffiti Signature Tag) -->
      <filter id="graffiti-handstyle" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" seed="8" result="grain" />
        <feTurbulence type="turbulence" baseFrequency="0.06" numOctaves="2" seed="3" result="wobble" />
        <feDisplacementMap in="SourceGraphic" in2="wobble" scale="6" xChannelSelector="R" yChannelSelector="G" result="roughStroke" />
        <feDisplacementMap in="roughStroke" in2="grain" scale="11" xChannelSelector="R" yChannelSelector="B" result="sprayedStroke" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="4.5" result="glow" />
        <feDisplacementMap in="glow" in2="grain" scale="20" result="overspray" />
        <feMerge>
          <feMergeNode in="overspray" />
          <feMergeNode in="sprayedStroke" />
        </feMerge>
      </filter>

      <!-- 3. Heavy Black Spray Shadow Filter -->
      <filter id="black-spray-shade" x="-30%" y="-30%" width="160%" height="160%">
        <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="21" result="stipple" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="softCore" />
        <feDisplacementMap in="softCore" in2="stipple" scale="18" xChannelSelector="R" yChannelSelector="G" />
      </filter>

      <!-- 4. Concrete Wall Grunge & Plaster Texture Filter -->
      <filter id="concrete-grain" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" stitchTiles="stitch" result="noise" />
        <feColorMatrix type="saturate" values="0" in="noise" result="monoNoise" />
        <feComponentTransfer in="monoNoise" result="contrastNoise">
          <feFuncA type="linear" slope="0.09" />
        </feComponentTransfer>
      </filter>
    </defs>
  </svg>

  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      motion,
      useScroll,
      useTransform,
      useSpring,
      useMotionValue,
      AnimatePresence

    /* ============================================================================
       REUSABLE HEADER BAR (Matches the top of every frame in reference image)
       ============================================================================ */
    const HeaderBar = ({ onNavClick, activeSection, isSticky = false }) => {

      return (

        >
          {/* Left: NOTIFORA Overlapping Double-Square Logo */}
          <a
            href="#hero"
            onClick={(e) => {
              e.preventDefault();
              onNavClick('OVERVIEW');
            }}
            className="group flex items-center gap-2 focus:outline-none"
          >
            <svg

              height="20"

                y="9.5"

                height="12"
                stroke="#0D0D0D"
                strokeWidth="2.3"
                fill="none"

              NOTIFORA

          </a>

          {/* Center: Navigation Links */}
          <nav className="hidden md:flex items-center gap-7 lg:gap-9">
            {navItems.map((item) => {
              const isActive = activeSection === item;
              return (
                <button
                  key={item}
                  onClick={() => onNavClick(item)}
                  className="relative group py-1 text-[10.5px] font-extrabold tracking-[0.14em] text-[#0D0D0D] transition-colors hover:text-[#0033FF]"

              whileHover={{ x: 2, y: -2 }}

              ↗
            </motion.span>
          </a>
        </header>
      );
    };

    /* ============================================================================
       SECTION 1: HERO ("DROPPED QUEUES... / Go HARD")
       ============================================================================ */
    const HeroSection = ({ mouseX, mouseY, onNavClick }) => {
      // Parallax transforms for multi-depth street art feel
      const bgTextX = useTransform(mouseX, [-0.5, 0.5], [-10, 10]);
      const bgTextY = useTransform(mouseY, [-0.5, 0.5], [-8, 8]);
      const graffitiX = useTransform(mouseX, [-0.5, 0.5], [18, -18]);
      const graffitiY = useTransform(mouseY, [-0.5, 0.5], [14, -14]);

      const backgroundLines = [
        'DROPPED QUEUES',
        'RATE LIMITED',
        'FAILED RETRIES',
        'SLACK SPAM',
        'SILENT FAILS',
        'SPAGHETTI SDKS',
      ];

      return (
        <section
          id="hero"
          className="relative w-full min-h-screen concrete-hero overflow-hidden flex flex-col justify-between select-none border-b border-black/10"

          {/* SVG Concrete Noise + Realistic Wall Cracks (Left Edge & Top Right) + White Grunge Splatter */}

            {/* White plaster distressed roller marks */}

            </g>

            {/* Authentic Wall Crack on Left Side (Matching reference image) */}
            <g stroke="#1E2024" fill="none" strokeLinecap="round" strokeLinejoin="round">
              {/* Main deep crack entering from left edge */}
              <path
                d="M-10,188 L18,210 L42,238 L49,255 L78,278 L72,306 L44,344 L36,368 L8,395 L-5,412"
                strokeWidth="2.6"
                opacity="0.78"
              />
              {/* Secondary micro-fissures */}
              <path
                d="M42,238 L66,232 L89,242 M78,278 L104,289 L124,285 M44,344 L62,362 L75,388 M36,368 L19,355"
                strokeWidth="1.1"

              />
              {/* Shadow edge along crack */}
              <path
                d="M-10,190 L20,213 L44,240 L80,280 L74,308 L46,346"

                opacity="0.16"
              />
              {/* Subtle top-right plaster crack */}
              <path
                d="M1190,0 L1198,28 L1215,48 L1210,76 L1232,96"

                opacity="0.25"

              {/* Bottom-left subtle hairline crack */}
              <path

                strokeWidth="1.1"
                opacity="0.3"

            </g>
          </svg>

          {/* Top Navigation Bar */}
          <HeaderBar onNavClick={onNavClick} activeSection="OVERVIEW" />

          {/* Main Hero Composition Container */}
          <div className="relative flex-1 flex items-center justify-center px-5 sm:px-9 md:px-12 py-8 md:py-12 z-10">
            <div className="relative w-full max-w-[1360px] mx-auto">
              {/* LAYER 1: Massive White Stacked Background Typography */}
              <motion.div
                style={{ x: bgTextX, y: bgTextY }}
                className="relative z-10 flex flex-col items-start justify-center"
              >
                {backgroundLines.map((line, index) => (
                  <div key={line} className="overflow-hidden w-full">
                    <motion.h2
                      initial={{ y: '105%', opacity: 0 }}
                      animate={{ y: '0%', opacity: 1 }}
                      transition={{
                        duration: 0.75,

                  </div>

              </motion.div>

              {/* LAYER 2: Foreground Street-Art Graffiti "Go HARD" (Electric Blue + Jet Black Spray + Drips) */}

                <svg

                  className="w-[106%] sm:w-[102%] max-w-[1360px] h-auto overflow-visible drop-shadow-[0_12px_28px_rgba(0,30,160,0.18)]"
                >
                  {/* ================= SPLATTER DOTS & OVERSPRAY MIST ================= */}
                  <g fill="#0033FF" opacity="0.85">
                    <circle cx="430" cy="245" r="4.5" />
                    <circle cx="445" cy="260" r="2.5" />

                    <circle cx="965" cy="415" r="2.5" />
                    <circle cx="620" cy="510" r="3.2" />
                  </g>
                  <g fill="#0A0A0A" opacity="0.85">
                    <circle cx="438" cy="252" r="3.5" />
                    <circle cx="454" cy="272" r="4.8" />
                    <circle cx="470" cy="258" r="2.2" />

                  {/* ================= "Go" (UPPER LEFT-CENTER GRAFFITI) ================= */}
                  <g filter="url(#graffiti-handstyle)">
                    {/* Letter 'G' — Outer sweeping wildstyle C-loop & crossbar */}

                    {/* Letter 'A' — Crossbar */}
                    <path
                      d="M 580 502 C 638 485, 698 468, 745 452"
                      fill="none"
                      stroke="#0038FF"

                      strokeLinecap="round"

                    {/* Letter 'R' — Stem + Bowl + Kick Leg */}
                    <motion.path

                      stroke="#0038FF"
                      strokeWidth="40"

                      strokeLinejoin="round"

                  {/* Heavy Black Spray Accents on "HARD" (Matching reference contrast) */}
                  <g filter="url(#black-spray-shade)">

                      d="M 328 552 L 485 495 M 462 562 L 442 632"

                      strokeLinecap="round"
                    />
                    {/* A black shading */}
                    <path
                      d="M 652 385 L 625 568 M 715 268 L 692 465"

                    <path

                      strokeWidth="44"
                      strokeLinecap="round"
                    />
                  </g>

                  {/* ================= VERTICAL PAINT DRIPS (Animated Gravity Drips) ================= */}
                  {/* Blue Drip under H right leg (Bottom-most long drip in reference) */}
                  <motion.g
                    initial={{ scaleY: 0 }}
                    animate={{ scaleY: 1 }}
                    transition={{ duration: 1.4, delay: 1.35, ease: 'easeOut' }}
                    style={{ originY: 0 }}
                  >
                    <path
                      d="M 436 675 L 434 748"
                      stroke="#0038FF"
                      strokeWidth="7"
                      strokeLinecap="round"
                    />
                    <circle cx="434" cy="751" r="5.5" fill="#0038FF" />

                    {/* Blue Drip under R kick */}
                    <path
                      d="M 766 490 L 766 575"
                      stroke="#0038FF"
                      strokeWidth="5.5"
                      strokeLinecap="round"
                    />
                    <circle cx="766" cy="578" r="4" fill="#0038FF" />

                    {/* Black Drip under A right stem */}
                    <path

    /* ============================================================================
       INTERACTIVE SPRAY PAINT CANVAS LAYER (Optional Street-Art UX Easter Egg)
       ============================================================================ */
    const SprayCanvasLayer = ({ enabled, clearTrigger }) => {
      const canvasRef = useRef(null);
      const isDrawing = useRef(false);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = document.documentElement.scrollHeight;
        };
        resize();
        window.addEventListener('resize', resize);
        return () => window.removeEventListener('resize', resize);
      }, []);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }, [clearTrigger]);

      const sprayAt = (x, y) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        // Soft aerosol core
        const grad = ctx.createRadialGradient(x, y, 2, x, y, 26);
        grad.addColorStop(0, 'rgba(0, 56, 255, 0.38)');
        grad.addColorStop(0.6, 'rgba(0, 56, 255, 0.12)');
        grad.addColorStop(1, 'rgba(0, 56, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, 26, 0, Math.PI * 2);
        ctx.fill();

        // Stipple droplets around nozzle
        ctx.fillStyle = '#0038FF';
        for (let i = 0; i < 28; i++) {
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.random() * 28;
          const dx = x + Math.cos(angle) * radius;
          const dy = y + Math.sin(angle) * radius;
          const size = Math.random() * 2.2;
          ctx.fillRect(dx, dy, size, size);
        }
      };

      const handlePointerDown = (e) => {
        if (!enabled) return;
        isDrawing.current = true;
        sprayAt(e.pageX, e.pageY);
      };

      const handlePointerMove = (e) => {
        if (!enabled || !isDrawing.current) return;
        sprayAt(e.pageX, e.pageY);
      };

      const handlePointerUp = () => {
        isDrawing.current = false;
      };

      return (
        <canvas
          ref={canvasRef}
          onPointerDown={handlePointerDown}
          onPointerMove={handlePointerMove}
          onPointerUp={handlePointerUp}
          className={`absolute inset-0 z-30 ${
            enabled ? 'pointer-events-auto spray-cursor-active' : 'pointer-events-none'
          }`}
        />
      );
    };

        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('scroll', handleScroll, { passive: true });
        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('scroll', handleScroll);
        };
      }, [rawMouseX, rawMouseY]);

      // Smooth navigation handler for Header links
      const handleNavClick = (section) => {
        if (section === 'HOME' || section === 'OVERVIEW') {
          document.getElementById('hero')?.scrollIntoView({ behavior: 'smooth' });
        } else if (section === 'ABOUT' || section === 'CHANNELS') {
          document.getElementById('slogan')?.scrollIntoView({ behavior: 'smooth' });
        } else if (section === 'SERVICE' || section === 'WORKFLOW') {
          document.getElementById('top-message')?.scrollIntoView({ behavior: 'smooth' });
        } else {
          const infoMap = {
            DOCS: {
              tag: 'DEVELOPER EXPERIENCE',
              title: 'INTEGRATE IN UNDER 5 MINUTES',
              subtitle: 'REST API sederhana. Cukup satu request untuk memicu workflow multi-channel (SDK menyusul).',
              body: 'Trigger workflow dengan satu request:\n\ncurl -X POST https://api.notifora.my.id/v1/events/trigger \\\n  -H "Authorization: Bearer ntf_live_..." \\\n  -H "X-Idempotency-Key: order-9901" \\\n  -H "Content-Type: application/json" \\\n  -d \'{"workflow":"order-confirmed","to":{"subscriberId":"usr_102","email":"user@domain.com","phone":"0812-3456-7890"},"payload":{"invoiceId":"INV-9901","amount":450000}}\'\n\nRetry otomatis dengan exponential backoff, idempotency key, dan log pengiriman real-time.',
            },
            PRICING: {
              tag: 'TRANSPARENT USAGE PRICING',
              title: 'PAY FOR WHAT YOU DISPATCH',
              subtitle: 'Tanpa lock-in kontrak. Mulai gratis untuk developer, scale saat traffic naik.',
              body: '• Starter: 10.000 events/bln — Rp 99.000/bln (Multi-channel, 7 hari activity log)\n• Pro: 50.000 events/bln — Rp 299.000/bln (Digest engine, custom branding, 30 hari log)\n• Business: 250.000 events/bln — Rp 799.000/bln (Dedicated queue, priority routing)\n• Scale: 1.000.000+ events/bln — Rp 1.999.000/bln (Dedicated Redis/DB cluster + SLA 99.99%)',
            },
            CONTACT: {
              tag: 'CONSOLE & API ACCESS',
              title: 'START TRIGGERING EVENTS',
              subtitle: 'Dapatkan API Key dan mulai kirim notifikasi sekarang.',
              body: 'API Gateway: https://api.notifora.my.id\nWeb Console: https://notifora.my.id/console\nDocs & Reference: https://notifora.my.id/docs\nEngineering Contact: support@notifora.my.id / Telegram: @notifora_support',
            },
            NEWS: {
              tag: 'LATEST UPDATES',
              title: 'ROADMAP',
              subtitle: 'Rilis 1.0 fokus pada WhatsApp, Email, Telegram, dan In-App Inbox.',
              body: '1.0 — Trigger API, workflow (delay, filter, fallback), preferensi subscriber, In-App Inbox real-time, webhook bertanda tangan.\nSetelah 1.0 — Push, SMS, Slack, digest, dan SDK resmi.',
            },
            RECRUIT: {
              tag: 'JOIN THE CORE TEAM',
              title: 'BUILDING REBEL INFRASTRUCTURE',
              subtitle: 'Kami mencari distributed systems engineer & backend enthusiast.',
              body: 'Tertarik mengoptimasi Redis pipelines, low-latency queues, dan resilient microservices? Hubungi kami di support@notifora.my.id.',
            },
          };
          setModalData(infoMap[section] || infoMap.CONTACT);
        }
      };

      return (
        <div className="relative min-h-screen w-full overflow-x-hidden">
          {/* Interactive Spray Paint Canvas Overlay (Toggled via bottom-left pill) */}
          <SprayCanvasLayer enabled={sprayMode} clearTrigger={clearCount} />

          {/* Floating Sticky Header on Scroll */}
          <AnimatePresence>
            {showStickyNav && (
              <motion.div
                initial={{ y: -60, opacity: 0 }}
                animate={{ y: 0, opacity: 1 }}
                exit={{ y: -60, opacity: 0 }}
                transition={{ duration: 0.25 }}
              >
                <HeaderBar onNavClick={handleNavClick} activeSection="" isSticky />
              </motion.div>
            )}
          </AnimatePresence>

          {/* 1. HERO SECTION ("GO HARD") */}
          <HeroSection
            mouseX={smoothMouseX}
            mouseY={smoothMouseY}
            onNavClick={handleNavClick}
          />

          {/* 2. SLOGAN SECTION ("ENDLESS NO LIMIT") */}
          <SloganSection
            onNavClick={handleNavClick}
            onOpenModal={(data) => setModalData(data)}
          />

          {/* 3. TOP MESSAGE SECTION ("MAXIMIZE EVERYONE'S POTENTIAL...") */}
          <TopMessageSection
            onNavClick={handleNavClick}
            onOpenModal={(data) => setModalData(data)}
          />

          {/* Minimal Interactive Street-Art Toolbar (Bottom-Left) */}
          <div className="fixed bottom-4 left-4 z-40 flex items-center gap-2">
            <button
              onClick={() => setSprayMode(!sprayMode)}
              className={`px-3.5 py-2 text-[10px] font-extrabold tracking-[0.14em] uppercase transition-all border shadow-sm flex items-center gap-2 ${
                sprayMode
                  ? 'bg-[#0033FF] text-white border-[#0033FF] shadow-[0_0_20px_rgba(0,51,255,0.5)]'
                  : 'bg-white/90 backdrop-blur-md text-[#0D0D0D] border-black/15 hover:border-[#0033FF]'
              }`}
            >
              <span
                className={`w-2 h-2 rounded-full ${
                  sprayMode ? 'bg-white animate-ping' : 'bg-[#0033FF]'
                }`}
              />
              {sprayMode ? 'SPRAY MODE: ON (DRAG TO TAG)' : 'TRY SPRAY CAN'}
            </button>

            {sprayMode && (
              <button
                onClick={() => setClearCount((c) => c + 1)}
                className="px-3 py-2 text-[10px] font-extrabold tracking-[0.12em] uppercase bg-[#0D0D0D] text-white hover:bg-[#0033FF] transition-colors"
              >
                CLEAR WALL
              </button>
            )}
          </div>

          {/* Brutalist Detail Modal (For VIEW MORE ↗ & Nav Items) */}
          <AnimatePresence>
            {modalData && (
              <motion.div
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                onClick={() => setModalData(null)}
                className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"
              >
                <motion.div
                  initial={{ y: 40, scale: 0.96, opacity: 0 }}
                  animate={{ y: 0, scale: 1, opacity: 1 }}
                  exit={{ y: 20, scale: 0.96, opacity: 0 }}
                  transition={{ type: 'spring', damping: 22, stiffness: 260 }}
                  onClick={(e) => e.stopPropagation()}
                  className="relative w-full max-w-xl bg-[#F4F6F9] border-2 border-[#0D0D0D] p-7 sm:p-10 shadow-[12px_12px_0px_#0033FF]"
                >
                  <div className="flex items-center justify-between mb-4">
                    <span className="text-[10px] font-extrabold tracking-[0.16em] text-[#0033FF] uppercase">
                      {modalData.tag}
                    </span>
                    <button
                      onClick={() => setModalData(null)}
                      className="text-xs font-black tracking-widest uppercase px-2.5 py-1 border border-black/20 hover:bg-[#0D0D0D] hover:text-white transition-colors"
                    >
                      CLOSE ✕
                    </button>
                  </div>

                  <h3 className="font-display text-2xl sm:text-4xl text-[#0D0D0D] uppercase mb-3 leading-none">
                    {modalData.title}
                  </h3>

                  <p className="font-jp font-bold text-sm text-[#0D0D0D] mb-4">
                    {modalData.subtitle}
                  </p>

                  <p className="font-jp text-xs sm:text-sm leading-relaxed text-[#333] whitespace-pre-line mb-6">
                    {modalData.body}
                  </p>

                  <div className="flex justify-end">
                    <button
                      onClick={() => setModalData(null)}
                      className="bg-[#0D0D0D] hover:bg-[#0033FF] text-white text-[11px] font-extrabold tracking-[0.14em] uppercase px-6 py-3 transition-colors flex items-center gap-2"
                    >
                      <span>BACK TO CANVAS</span>
                      <span>↗</span>
                    </button>
                  </div>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
