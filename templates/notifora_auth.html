  <style>

<body>
  <!-- Global SVG Filters for Aerosol Spray Paint and Concrete Grain -->
  <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
    <defs>
      <filter id="aerosol-spray" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" seed="14" result="fineNoise" />
        <feTurbulence type="turbulence" baseFrequency="0.045" numOctaves="3" seed="5" result="coarseNoise" />
        <feDisplacementMap in="SourceGraphic" in2="coarseNoise" scale="9" xChannelSelector="R" yChannelSelector="G" result="coarseDisplaced" />
        <feDisplacementMap in="coarseDisplaced" in2="fineNoise" scale="14" xChannelSelector="R" yChannelSelector="B" result="fineDisplaced" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="mistBlur" />
        <feMerge>
          <feMergeNode in="mistBlur" />
          <feMergeNode in="fineDisplaced" />
        </feMerge>
      </filter>

      <filter id="concrete-grain" x="0%" y="0%" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="4" stitchTiles="stitch" result="noise" />
        <feColorMatrix type="saturate" values="0" in="noise" result="monoNoise" />
        <feComponentTransfer in="monoNoise" result="contrastNoise">
          <feFuncA type="linear" slope="0.09" />
        </feComponentTransfer>
      </filter>
    </defs>
  </svg>

  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef } from 'react';
    import { createRoot } from 'react-dom/client';
    import { motion, AnimatePresence } from 'framer-motion';

    /* ============================================================================
       CANVAS SPRAY EFFECT
       ============================================================================ */
    const SprayCanvasLayer = ({ enabled, clearTrigger }) => {
      const canvasRef = useRef(null);
      const isDrawing = useRef(false);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = document.documentElement.scrollHeight;
        };
        resize();
        window.addEventListener('resize', resize);
        return () => window.removeEventListener('resize', resize);
      }, []);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }, [clearTrigger]);

      const sprayAt = (x, y) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const grad = ctx.createRadialGradient(x, y, 2, x, y, 24);
        grad.addColorStop(0, 'rgba(0, 51, 255, 0.35)');
        grad.addColorStop(0.6, 'rgba(0, 51, 255, 0.12)');
        grad.addColorStop(1, 'rgba(0, 51, 255, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, 24, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0033FF';
        for (let i = 0; i < 22; i++) {
          const angle = Math.random() * Math.PI * 2;
          const radius = Math.random() * 26;
          const dx = x + Math.cos(angle) * radius;
          const dy = y + Math.sin(angle) * radius;
          ctx.fillRect(dx, dy, Math.random() * 2.2, Math.random() * 2.2);
        }
      };

      return (
        <canvas
          ref={canvasRef}
          onPointerDown={(e) => {
            if (!enabled) return;
            isDrawing.current = true;
            sprayAt(e.pageX, e.pageY);
          }}
          onPointerMove={(e) => {
            if (!enabled || !isDrawing.current) return;
            sprayAt(e.pageX, e.pageY);
          }}
          onPointerUp={() => { isDrawing.current = false; }}
          className={`absolute inset-0 z-30 ${
            enabled ? 'pointer-events-auto spray-cursor-active' : 'pointer-events-none'
          }`}
        />
      );
    };

    /* ============================================================================
       AUTH APP
       ============================================================================ */
    const AuthApp = () => {
      const [mode, setMode] = useState('login'); // 'login' | 'register'
      const [sprayMode, setSprayMode] = useState(false);
      const [clearCount, setClearCount] = useState(0);

      // Form state
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [name, setName] = useState('');
      const [team, setTeam] = useState('');
      const [channel, setChannel] = useState('whatsapp');
      const [showPassword, setShowPassword] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [authResult, setAuthResult] = useState(null);

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsLoading(true);

        setTimeout(() => {
          setIsLoading(false);
          // PROTOTYPE ONLY: key demo, tidak valid. Produksi: API key dibuat server di Console (Settings > API Keys).
          const generatedKey = 'ntf_test_DEMO_NOT_A_REAL_KEY';
          setAuthResult({
            user: email || 'developer@notifora.my.id',
            apiKey: generatedKey,
            mode: mode,
            timestamp: new Date().toLocaleTimeString(),
          });
        }, 1200);
      };

      return (
        <div className="relative min-h-screen w-full concrete-bg flex flex-col justify-between selection:bg-[#0033FF] selection:text-white">
          {/* Concrete Noise Overlay */}
          <svg
            className="absolute inset-0 w-full h-full pointer-events-none z-0"
            viewBox="0 0 1440 900"
            preserveAspectRatio="xMidYMid slice"
          >
            <rect width="1440" height="900" filter="url(#concrete-grain)" />
            {/* Distressed wall grunge */}
            <path
              d="M0,0 L380,0 C280,180 120,290 0,340 Z"
              fill="#D2D9E4"
              opacity="0.6"
              filter="url(#aerosol-spray)"
            />
            <path
              d="M1080,900 L1440,900 L1440,560 C1300,680 1180,820 1080,900 Z"
              fill="#D2D9E4"
              opacity="0.5"
              filter="url(#aerosol-spray)"
            />
          </svg>

          {/* Interactive spray canvas */}
          <SprayCanvasLayer enabled={sprayMode} clearTrigger={clearCount} />

          {/* TOP HEADER */}
          <header className="relative z-20 w-full px-6 sm:px-10 py-5 flex items-center justify-between border-b border-black/10 bg-[#E3E7EE]/60 backdrop-blur-md">
            {/* Logo */}
            <a href="notifora_landing.html" className="group flex items-center gap-2.5 focus:outline-none">
              <svg
                width="22"
                height="22"
                viewBox="0 0 24 24"
                fill="none"
                className="transition-transform duration-300 group-hover:rotate-90"
              >
                <rect x="2.5" y="2.5" width="12" height="12" stroke="#0D0D0D" strokeWidth="2.3" fill="none" />
                <rect x="9.5" y="9.5" width="12" height="12" stroke="#0D0D0D" strokeWidth="2.3" fill="none" />
              </svg>
              <div className="flex flex-col">
                <span className="font-extrabold text-[14px] tracking-[0.08em] text-[#0D0D0D]">NOTIFORA</span>
                <span className="font-mono text-[8px] font-bold tracking-widest text-[#0033FF] uppercase -mt-0.5">DEV CONSOLE</span>
              </div>
            </a>

            {/* Back link */}
            <a
              href="notifora_landing.html"
              className="text-[11px] font-mono font-bold tracking-wider text-[#0D0D0D] hover:text-[#0033FF] flex items-center gap-1.5 transition-colors"
            >
              <span>←</span>
              <span>BACK TO MAIN SITE</span>
            </a>
          </header>

          {/* MAIN CONTAINER */}
          <main className="relative z-20 flex-1 flex items-center justify-center px-4 py-10 sm:py-14">
            <div className="w-full max-w-[540px]">
              {/* Top Banner Tag */}
              <div className="flex items-center justify-between mb-3 px-1">
                <div className="flex items-center gap-2">
                  <span className="inline-block w-2.5 h-2.5 bg-[#0033FF] animate-pulse"></span>
                  <span className="font-mono text-[10.5px] font-black uppercase tracking-[0.18em] text-[#0D0D0D]">
                    CORE PROTOCOL AUTH
                  </span>
                </div>
                <span className="font-mono text-[10px] text-[#555] tracking-widest">
                  MODE: <span className="text-[#0033FF] font-bold">PROTOTYPE</span>
                </span>
              </div>

              {/* MAIN BRUTALIST AUTH CARD */}
              <div className="relative bg-[#F4F6F9] border-[3px] border-[#0D0D0D] shadow-[10px_10px_0px_#0033FF] p-6 sm:p-9 transition-all">
                {/* Street spray drip accent */}
                <div className="absolute -top-3 -right-3 bg-[#0D0D0D] text-white font-mono text-[9px] font-black tracking-widest uppercase px-2 py-0.5 border border-white">
                  TLS ENCRYPTED
                </div>

                {/* TABS SWITCHER */}
                <div className="grid grid-cols-2 gap-2 mb-7 p-1 bg-[#DCE1E9] border-2 border-[#0D0D0D]">
                  <button
                    type="button"
                    onClick={() => { setMode('login'); setAuthResult(null); }}
                    className={`py-2.5 font-display text-xs sm:text-sm uppercase tracking-wider transition-all ${
                      mode === 'login'
                        ? 'bg-[#0D0D0D] text-white shadow-[2px_2px_0px_#0033FF]'
                        : 'text-[#0D0D0D] hover:bg-white/60'
                    }`}
                  >
                    SIGN IN
                  </button>
                  <button
                    type="button"
                    onClick={() => { setMode('register'); setAuthResult(null); }}
                    className={`py-2.5 font-display text-xs sm:text-sm uppercase tracking-wider transition-all ${
                      mode === 'register'
                        ? 'bg-[#0D0D0D] text-white shadow-[2px_2px_0px_#0033FF]'
                        : 'text-[#0D0D0D] hover:bg-white/60'
                    }`}
                  >
                    REGISTER
                  </button>
                </div>

                {/* MODAL SUCCESS SCREEN (After submit) */}
                {authResult ? (
                  <motion.div
                    initial={{ opacity: 0, scale: 0.95 }}
                    animate={{ opacity: 1, scale: 1 }}
                    className="space-y-5"
                  >
                    <div className="p-4 bg-white border-2 border-[#0D0D0D] shadow-[4px_4px_0px_#0033FF]">
                      <div className="flex items-center gap-2 mb-2 text-[#0033FF]">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3">
                          <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span className="font-mono text-xs font-black uppercase tracking-wider">
                          {mode === 'login' ? 'DEMO SESSION (PROTOTYPE)' : 'DEMO ACCOUNT (PROTOTYPE)'}
                        </span>
                      </div>
                      <p className="font-mono text-[11px] text-[#333] mb-3">
                        Authenticated as: <strong>{authResult.user}</strong>
                      </p>

                      <div className="bg-[#0D0D0D] p-3 border border-black/20 text-[#00FF66] font-mono text-[11px]">
                        <div className="text-[9px] text-[#888] uppercase tracking-wider mb-1">DEMO KEY (NOT VALID, PROTOTYPE):</div>
                        <div className="select-all break-all font-bold">{authResult.apiKey}</div>

                    </div>

                    <div className="space-y-2">
                      <button

                        AUTHENTICATE ANOTHER ACCOUNT
                      </button>
                    </div>
                  </motion.div>
                ) : (
                  <>
                    {/* SOCIAL OAUTH BUTTONS */}
                    <div className="grid grid-cols-2 gap-3 mb-6">
                      <button
                        type="button"
                        onClick={() => {
                          setEmail('github_dev@octocat.local');
                          handleSubmit({ preventDefault: () => {} });

                        className="py-2.5 px-3 bg-white hover:bg-[#0D0D0D] hover:text-white text-[#0D0D0D] border-2 border-[#0D0D0D] font-mono text-xs font-bold tracking-wider shadow-[3px_3px_0px_#0D0D0D] active:translate-x-0.5 active:translate-y-0.5 transition-all flex items-center justify-center gap-2"
                      >
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                          <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                        </svg>
                        <span>GITHUB</span>
                      </button>

                      <button
                        type="button"
                        onClick={() => {
                          setEmail('google_dev@gmail.com');
                          handleSubmit({ preventDefault: () => {} });
                        }}
                        className="py-2.5 px-3 bg-white hover:bg-[#0033FF] hover:text-white text-[#0D0D0D] border-2 border-[#0D0D0D] font-mono text-xs font-bold tracking-wider shadow-[3px_3px_0px_#0D0D0D] active:translate-x-0.5 active:translate-y-0.5 transition-all flex items-center justify-center gap-2"
                      >
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                          <path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/>
                        </svg>
                        <span>GOOGLE</span>
                      </button>
                    </div>

                    {/* DIVIDER */}
                    <div className="relative flex items-center justify-center mb-6">
                      <div className="w-full border-t border-black/20"></div>
                      <span className="absolute bg-[#F4F6F9] px-3 font-mono text-[9px] font-black tracking-widest text-[#777] uppercase">
                        // OR PROTOCOL CREDENTIALS //
                      </span>
                    </div>

                    {/* ACTUAL FORM */}
                    <form onSubmit={handleSubmit} className="space-y-4">
                      {mode === 'register' && (
                        <>
                          <div>
                            <label className="block font-mono text-[10px] font-black uppercase tracking-wider text-[#0D0D0D] mb-1.5">
                              DEVELOPER NAME / HANDLE *
                            </label>
                            <input
                              type="text"
                              required
                              placeholder="e.g. Alex Vance (@alex_dev)"
                              value={name}
                              onChange={(e) => setName(e.target.value)}
                              className="w-full p-2.5 brutalist-input text-xs"
                            />
                          </div>

                          <div>
                            <label className="block font-mono text-[10px] font-black uppercase tracking-wider text-[#0D0D0D] mb-1.5">
                              ORGANIZATION / TEAM (OPTIONAL)
                            </label>
                            <input
                              type="text"
                              placeholder="e.g. Acme Corp / Stealth Startup"
                              value={team}
                              onChange={(e) => setTeam(e.target.value)}
                              className="w-full p-2.5 brutalist-input text-xs"
                            />
                          </div>

                          <div>
                            <label className="block font-mono text-[10px] font-black uppercase tracking-wider text-[#0D0D0D] mb-1.5">
                              PRIMARY DISPATCH CHANNEL
                            </label>
                            <div className="grid grid-cols-3 gap-2">
                              {[
                                { id: 'whatsapp', label: 'WHATSAPP' },
                                { id: 'email', label: 'EMAIL (SMTP)' },
                                { id: 'push', label: 'PUSH / IN-APP' },
                              ].map((ch) => (
                                <button
                                  type="button"
                                  key={ch.id}
                                  onClick={() => setChannel(ch.id)}
                                  className={`py-2 px-1 text-[10px] font-mono font-bold tracking-wider border-2 border-[#0D0D0D] transition-all ${
                                    channel === ch.id
                                      ? 'bg-[#0033FF] text-white shadow-[2px_2px_0px_#0D0D0D]'
                                      : 'bg-white text-[#0D0D0D] hover:bg-gray-100'
                                  }`}
                                >
                                  {ch.label}
                                </button>
                              ))}
                            </div>
                          </div>
                        </>
                      )}

                      <div>
                        <label className="block font-mono text-[10px] font-black uppercase tracking-wider text-[#0D0D0D] mb-1.5">
                          WORK EMAIL ADDRESS *
                        </label>
                        <input
                          type="email"
                          required
                          placeholder="dev@organization.io"
                          value={email}
                          onChange={(e) => setEmail(e.target.value)}
                          className="w-full p-2.5 brutalist-input text-xs"
                        />
                      </div>

                      <div>
                        <div className="flex items-center justify-between mb-1.5">
                          <label className="font-mono text-[10px] font-black uppercase tracking-wider text-[#0D0D0D]">
                            SECRET PASSPHRASE *
                          </label>
                          {mode === 'login' && (
                            <a href="#reset" onClick={(e) => { e.preventDefault(); alert('Password reset link will be dispatched to your email.'); }} className="font-mono text-[9px] text-[#0033FF] hover:underline">
                              RECOVER?
                            </a>
                          )}
                        </div>
                        <div className="relative">
                          <input
                            type={showPassword ? 'text' : 'password'}
                            required
                            placeholder="••••••••••••••••"
                            value={password}
                            onChange={(e) => setPassword(e.target.value)}
                            className="w-full p-2.5 brutalist-input text-xs pr-14"
                          />
                          <button
                            type="button"
                            onClick={() => setShowPassword(!showPassword)}
                            className="absolute right-2 top-1/2 -translate-y-1/2 font-mono text-[9px] font-bold uppercase tracking-wider px-1.5 py-1 text-[#555] hover:text-[#0D0D0D]"
                          >
                            {showPassword ? 'HIDE' : 'SHOW'}
                          </button>
                        </div>
                      </div>

                      {mode === 'register' && (
                        <div className="flex items-start gap-2 pt-1">
                          <input
                            type="checkbox"
                            required
                            id="terms"
                            className="mt-1 accent-[#0033FF]"
                          />
                          <label htmlFor="terms" className="font-mono text-[10px] text-[#444] leading-tight">
                            I agree to Notifora Developer Terms, plan-based rate limits, and zero-spam policy.
                          </label>
                        </div>
                      )}

                      {/* SUBMIT BUTTON */}
                      <button
                        type="submit"
                        disabled={isLoading}
                        className="w-full mt-4 py-3.5 bg-[#0D0D0D] hover:bg-[#0033FF] text-white font-display text-sm uppercase tracking-widest border-2 border-[#0D0D0D] shadow-[5px_5px_0px_#0033FF] active:translate-x-0.5 active:translate-y-0.5 transition-all flex items-center justify-center gap-2 group cursor-pointer"
                      >
                        {isLoading ? (
                          <span className="font-mono text-xs flex items-center gap-2">
                            <span className="w-3 h-3 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                            PROVISIONING CREDENTIALS...
                          </span>
                        ) : (
                          <>
                            <span>{mode === 'login' ? 'ESTABLISH SESSION' : 'CLAIM API KEYS & DEPLOY'}</span>
                            <span className="group-hover:translate-x-1 transition-transform">↗</span>
                          </>
                        )}
                      </button>
                    </form>
                  </>
                )}

                {/* BOTTOM HELPER */}
                <div className="mt-6 pt-4 border-t border-black/10 flex items-center justify-between font-mono text-[10px] text-[#777]">
                  <span>PROTOTYPE UI</span>
                  <a href="https://notifora.my.id/docs" onClick={(e) => { e.preventDefault(); alert('Redirecting to API Reference (Mock)'); }} className="text-[#0033FF] hover:underline font-bold">
                    VIEW DOCS [API SPEC] ↗
                  </a>
                </div>
              </div>

              {/* QUICK TERMINAL CODE SNIPPET (Developer aesthetic touch) */}
              <div className="mt-6 bg-[#0D0D0D] border-2 border-[#0D0D0D] p-4 text-[#E3E7EE] font-mono text-xs shadow-[6px_6px_0px_rgba(0,51,255,0.4)]">
                <div className="flex items-center justify-between text-[10px] text-[#777] pb-2 mb-2 border-b border-white/10">
                  <span className="text-[#0033FF] font-bold">CLI QUICK START:</span>
                  <span>BASH</span>
                </div>
                <div className="text-[11px] leading-relaxed text-[#A0AEC0]">
                  <span className="text-[#00FF66]">$</span> curl -X POST https://api.notifora.my.id/v1/events/trigger \<br />
                  &nbsp;&nbsp;-H <span className="text-[#F6E05E]">"Authorization: Bearer ntf_live_..."</span> \<br />
                  &nbsp;&nbsp;-d <span className="text-[#63B3ED]">'&#123;"workflow": "order-confirmed", "to": &#123;"subscriberId": "usr_102", "phone": "0812-3456-7890"&#125;&#125;'</span>
                </div>
              </div>
            </div>
          </main>

          {/* MINIMAL STREET ART TOOLBAR (Bottom-Left) */}
          <div className="relative z-40 px-6 py-4 flex items-center justify-between border-t border-black/10 bg-[#E3E7EE]/60 backdrop-blur-md">
            <div className="flex items-center gap-2">
              <button
                onClick={() => setSprayMode(!sprayMode)}
                className={`px-3 py-1.5 text-[10px] font-mono font-black tracking-wider uppercase transition-all border shadow-sm flex items-center gap-2 ${
                  sprayMode
                    ? 'bg-[#0033FF] text-white border-[#0033FF] shadow-[0_0_15px_rgba(0,51,255,0.5)]'
                    : 'bg-white/90 text-[#0D0D0D] border-black/15 hover:border-[#0033FF]'
                }`}
              >
                <span className={`w-1.5 h-1.5 rounded-full ${sprayMode ? 'bg-white animate-ping' : 'bg-[#0033FF]'}`} />
                {sprayMode ? 'SPRAY: ACTIVE (DRAG)' : 'TRY SPRAY CAN'}
              </button>

              {sprayMode && (
                <button
                  onClick={() => setClearCount((c) => c + 1)}
                  className="px-2.5 py-1.5 text-[10px] font-mono font-bold tracking-wider uppercase bg-[#0D0D0D] text-white hover:bg-[#0033FF] transition-colors"
                >
                  CLEAR
                </button>
              )}
            </div>

            <div className="font-mono text-[10px] text-[#777] hidden sm:block">
              NOTIFORA &copy; 2026 — REBEL NOTIFICATION ENGINE
            </div>
          </div>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<AuthApp />);
  </script>
</body>
</html>
